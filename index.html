<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roblox Marketplace</title>
<link rel="stylesheet" href="./style.css">
<script src="./config.js"></script>

<style>
/* TOMBOL SALURAN WHATSAPP */
.whatsapp-access {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    box-sizing: border-box;
    padding: 13px 12px;
    margin: 12px 0 18px;
    background: #25D366;
    color: #ffffff;
    border-radius: 10px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.3px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
}

.whatsapp-access:hover {
    background: #1ebe5d;
    transform: translateY(-2px);
}

.whatsapp-access:active {
    transform: scale(0.98);
}

.whatsapp-access svg {
    flex-shrink: 0;
}
</style>
</head>

<body>

<!-- OVERLAY LOGIN SISTEM -->
<div id="auth-overlay" class="auth-overlay">
  <div class="auth-card">

    <div class="auth-icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24"
           fill="none" stroke="#0055ff" stroke-width="2.2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h2 class="auth-title">Akses Akun</h2>

    <p class="auth-desc">
      Untuk membeli akses website, silakan bergabung ke saluran WhatsApp kami terlebih dahulu.
    </p>

    <!-- TOMBOL SALURAN WHATSAPP -->
    <a href="https://whatsapp.com/channel/0029VbDyE3oJf05fJjGFQE2W"
       class="whatsapp-access"
       target="_blank"
       rel="noopener noreferrer">

      <svg viewBox="0 0 24 24" width="22" height="22"
           fill="currentColor">
        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.34 4.97L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.91-7.01A9.85 9.85 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.11.82.83-3.03-.2-.31a8.2 8.2 0 1 1 6.97 3.84z"/>
      </svg>

      <span>GABUNG SALURAN WHATSAPP</span>
    </a>

    <p class="auth-desc">
      Bergabunglah untuk mendapatkan informasi pembelian akses.
    </p>

    <div id="auth-error" class="auth-error"></div>

    <div class="auth-input-group">
      <label>USERNAME</label>
      <input type="text" id="login-username"
             class="auth-input"
             placeholder="Masukkan username"
             autocomplete="off">
    </div>

    <div class="auth-input-group">
      <label>PASSWORD</label>
      <input type="password" id="login-password"
             class="auth-input"
             placeholder="••••••••">
    </div>

    <button type="button"
            class="primary auth-submit-btn"
            onclick="handleLoginSubmit()">
      Masuk ke Web
    </button>

  </div>
</div>

<!--
PERTAHANKAN SELURUH KODE MARKETPLACE ASLI KAMU
DI BAGIAN INI, TERMASUK HEADER, PRODUK,
RECOMMENDATIONS, SETTINGS, GIFT, DAN TOAST.
-->

<script src="./apps.js" defer></script>
</body>
</html>
